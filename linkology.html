<script>
(function () {
    var MAX_ALIENS = 128;
    var aliens = [];

    function viewW() { return document.documentElement.clientWidth; }
    function viewH() { return window.innerHeight; }

    function rand(min, max) { return min + Math.random() * (max - min); }

    function spawn() {
        var el = document.createElement('div');
        el.className = 'alien';
        el.textContent = '👾';
        document.body.appendChild(el);
        var a = {
            el: el,
            bounces: 0,
            x: rand(0, Math.max(viewW() - el.offsetWidth, 0)),
            y: rand(0, Math.max(viewH() - el.offsetHeight, 0)),
            vx: (Math.random() < 0.5 ? -1 : 1) * rand(1.4, 2.4),
            vy: (Math.random() < 0.5 ? -1 : 1) * rand(1.2, 2.2)
        };
        aliens.push(a);
    }

    function frame() {
        var n = aliens.length;
        for (var i = 0; i < n; i++) {
            var a = aliens[i];
            var w = Math.max(viewW() - a.el.offsetWidth, 0);
            var h = Math.max(viewH() - a.el.offsetHeight, 0);
            var hit = false;
            a.x += a.vx;
            a.y += a.vy;
            if (a.x <= 0) { a.x = 0; a.vx = Math.abs(a.vx); hit = true; }
            if (a.x >= w) { a.x = w; a.vx = -Math.abs(a.vx); hit = true; }
            if (a.y <= 0) { a.y = 0; a.vy = Math.abs(a.vy); hit = true; }
            if (a.y >= h) { a.y = h; a.vy = -Math.abs(a.vy); hit = true; }
            a.el.style.transform = 'translate(' + a.x + 'px,' + a.y + 'px)';
        }
        requestAnimationFrame(frame);
    }

    spawn();
    requestAnimationFrame(frame);
})();
</script>
