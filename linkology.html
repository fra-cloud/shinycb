<div id="alien">👾</div>

<script>
(function () {
    var el = document.getElementById('alien');
    var x = 50, y = 50, vx = 2, vy = 1.6;
    function frame() {
        var w = document.documentElement.clientWidth - el.offsetWidth;
        var h = window.innerHeight - el.offsetHeight;
        x += vx;
        y += vy;
        if (x <= 0) { x = 0; vx = Math.abs(vx); }
        if (x >= w) { x = Math.max(w, 0); vx = -Math.abs(vx); }
        if (y <= 0) { y = 0; vy = Math.abs(vy); }
        if (y >= h) { y = Math.max(h, 0); vy = -Math.abs(vy); }
        el.style.transform = 'translate(' + x + 'px,' + y + 'px)';
        requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
})();
</script>
